name: CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "*"
  pull_request:

permissions:
  contents: read
  packages: write
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-plotter:
    name: Lint plotter
    runs-on: arc-frixxie-runner
    container:
      image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run ruff
        run: |
          uv tool run ruff check plotter/
          uv tool run ruff format --check plotter/

  build-plotter:
    name: Build plotter
    needs: lint-plotter
    runs-on: arc-frixxie-runner
    container:
      image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync dependencies
        working-directory: plotter
        run: uv sync --frozen

  test-plotter:
    name: Test plotter
    needs: build-plotter
    runs-on: arc-frixxie-runner
    container:
      image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync dependencies
        working-directory: plotter
        run: uv sync --frozen

      - name: Run tests
        working-directory: plotter
        run: uv run pytest

  build-backend:
    name: Build backend
    runs-on: arc-frixxie-runner
    container:
      image: rust:latest
    env:
      SQLX_OFFLINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Rust versions
        run: rustc --version && cargo --version

      - name: Build workspace
        run: cargo build --workspace --verbose

  test-backend:
    name: Test backend
    needs: build-backend
    runs-on: arc-frixxie-runner
    container:
      image: rust:latest
    env:
      SQLX_OFFLINE: "1"
      DATABASE_URL: postgresql://postgres:admin@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PostgreSQL with TimescaleDB and PostGIS
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg postgresql-common
          /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          . /etc/os-release
          curl -fsSL https://packagecloud.io/timescale/timescaledb/gpgkey \
            | gpg --dearmor -o /usr/share/keyrings/timescaledb.gpg
          echo "deb [signed-by=/usr/share/keyrings/timescaledb.gpg] https://packagecloud.io/timescale/timescaledb/debian/ ${VERSION_CODENAME} main" \
            > /etc/apt/sources.list.d/timescaledb.list
          apt-get update
          apt-get install -y --no-install-recommends postgresql-18 timescaledb-2-postgresql-18 postgresql-18-postgis-3
          echo "shared_preload_libraries = 'timescaledb'" >> /etc/postgresql/18/main/postgresql.conf
          echo "timescaledb.telemetry_level = off" >> /etc/postgresql/18/main/postgresql.conf
          pg_ctlcluster 18 main start
          su postgres -c "psql -c \"ALTER USER postgres PASSWORD 'admin'\""

      - name: Show Rust versions
        run: rustc --version && cargo --version

      - name: Run tests
        run: cargo test --workspace --verbose

  lint-frontend:
    name: Lint frontend
    runs-on: arc-frixxie-runner
    container:
      image: denoland/deno:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check formatting
        working-directory: frontend
        run: deno fmt --check .

      - name: Lint
        working-directory: frontend
        run: deno lint .

  build-frontend:
    name: Build frontend
    needs: lint-frontend
    runs-on: arc-frixxie-runner
    container:
      image: denoland/deno:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check frontend
        working-directory: frontend
        run: deno task check

      - name: Build frontend
        working-directory: frontend
        run: deno task build

  test-frontend:
    name: Test frontend
    needs: build-frontend
    runs-on: arc-frixxie-runner
    container:
      image: denoland/deno:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run tests
        working-directory: frontend
        run: deno task test

  deploy-backend:
    name: Deploy backend image
    needs:
      - test-plotter
      - test-backend
      - test-frontend
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}"
          echo "name=${image,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}

  deploy-plotter:
    name: Deploy plotter image
    needs:
      - test-plotter
      - test-backend
      - test-frontend
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}/plotter"
          echo "name=${image,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: plotter
          file: plotter/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}

  deploy-frontend:
    name: Deploy frontend image
    needs:
      - test-plotter
      - test-backend
      - test-frontend
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}/frontend"
          echo "name=${image,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          build-args: |
            GIT_REVISION=${{ github.sha }}
